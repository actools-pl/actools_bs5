name: Theme source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install source-check dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Validate Composer package metadata
        run: composer validate --strict --no-check-publish
      - name: Lint runtime and test PHP
        run: find . -type f \( -name '*.php' -o -name '*.theme' -o -name '*.inc' -o -name '*.install' \) -not -path './.git/*' -print0 | xargs -0 -r -n 1 php -l
      - name: Audit assets, metadata and JavaScript syntax
        run: |
          theme_audit_dir="$RUNNER_TEMP/actools-theme-source"
          mkdir -p "$theme_audit_dir"
          git archive HEAD | tar -x -C "$theme_audit_dir"
          python tests/tools/actools_bs5_static_audit_tests.py "$theme_audit_dir" --require-php
      - name: Layout source regressions
        run: python tests/tools/test_layout_regressions.py
      - name: Verify compiled navigation and sticky styles
        run: |
          npm ci --ignore-scripts
          npm run build:css -- --entry=theme/navigation.theme --entry=theme/sticky-header.theme
          cmp .build/css/theme/navigation.theme.css css/theme/navigation.theme.css
          cmp .build/css/theme/sticky-header.theme.css css/theme/sticky-header.theme.css
      - name: CSS publication guard regressions
        run: npm run test:build-tools

# These checks do not run Drupal Kernel/Functional suites or certify browser
# behavior. See TESTING.md. Do not overwrite shipped CSS with the known-drifting
# Sass build during this source-validation workflow.

