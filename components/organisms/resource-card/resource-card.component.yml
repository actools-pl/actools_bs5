$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Resource card
group: Teaching resources
status: experimental
description: A linked resource heading with Drupal-rendered image and summary slots. Intended for the optional teaching-pages recipe.
props:
  type: object
  properties:
    title_attributes:
      type: Drupal\Core\Template\Attribute
      title: Heading attributes
    heading:
      type: string
      title: Resource title
      default: ''
    url:
      type: string
      format: uri-reference
      title: Resource page URL
      default: ''
slots:
  media:
    title: Resource image
    description: The image field render array, retaining its formatter, alt text and cache metadata.
  body:
    title: Resource summary
    description: The summary field render array. Keep downloads and full content on the linked resource page.
