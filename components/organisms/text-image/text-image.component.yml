$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Text and image
group: Teaching resources
status: experimental
description: A readable introduction with an optional uncropped image. All formatted text and media are rendered by Drupal field formatters.
props:
  type: object
  properties:
    title_attributes:
      type: Drupal\Core\Template\Attribute
      title: Heading attributes
    heading:
      type: string
      title: Section heading
      default: ''
    position:
      type: string
      title: Image position on wider screens
      enum: [left, right]
      default: right
    has_media:
      type: boolean
      title: Display the media slot
      description: Indicates a nonempty image field is present in the display. The component renders its original media slot once and shows the figure/caption only when deferred access leaves actual media output.
      default: false
slots:
  heading_content:
    title: Rendered heading field
    description: The original Drupal field render array. Its deferred access checks run before heading markup or attachments are emitted; overrides the plain heading prop.
  body:
    title: Formatted text
    description: Drupal's formatted text field render array, preserving text-format filtering and attachments.
  media:
    title: Image
    description: Drupal's image field render array, retaining alt text, dimensions and field access.
  caption:
    title: Optional image caption
    description: Drupal's plain-text caption field render array. Its field template supplies figcaption after core access checks; rendered only with the media slot.
