framework:
  dependencies:
    - core/components.actools_bs5--root
    - actools_bs5/bootstrap-styles
    - actools_bs5/bootstrap-scripts
    - actools_bs5/global-styles
    - actools_bs5/global-scripts
    - actools_bs5/bootstrap-icons

# Native Layout Discovery sections, loaded only when a section is rendered.
layout-builder:
  css:
    layout:
      css/layout/builder.layout.css: {}

# The optional starter's entity-reference formatter shares one responsive grid.
resource-card-grid:
  css:
    component:
      components/organisms/resource-card/resource-card-grid.css: {}

# Optional Topic/Resource publishing styles; attached only by their templates.
publishing:
  css:
    theme:
      css/theme/publishing.theme.css: {}

# Bootstrap 5 global styles library.
bootstrap-styles:
  css:
    base:
      css/base/bootstrap.base.css: {}
      # Restores the Bootstrap :root token block the build omits (see tokens.base.scss).
      css/base/tokens.base.css: {}

# Bootstrap 5 global scripts library.
bootstrap-scripts:
  dependencies:
    - actools_bs5/bs-base-component-script
    # - actools_bs5/bs-alert-script
    # - actools_bs5/bs-button-script
    - actools_bs5/bs-carousel-script
    # Needed for Bootstrap Accordion (Accordion is powered by Collapse).
    - actools_bs5/bs-collapse-script
    # - actools_bs5/bs-dropdown-script
    - actools_bs5/bs-modal-script
    - actools_bs5/bs-offcanvas-script
    - actools_bs5/bs-popover-script
    - actools_bs5/bs-scrollspy-script
    - actools_bs5/bs-tab-script
    - actools_bs5/bs-toast-script
    - actools_bs5/bs-tooltip-script

# Popperjs core.
popper-script:
  js:
    js/popperjs/popper.js: {}

# Bootstrap Base component script.
bs-base-component-script:
  dependencies:
    - core/drupalSettings
    - core/drupal
    - core/drupal.ajax
    - core/jquery
    - core/once
    - actools_bs5/popper-script
  js:
    js/bootstrap/util/index.js: {}
    js/bootstrap/dom/data.js: {}
    js/bootstrap/dom/event-handler.js: {}
    js/bootstrap/dom/manipulator.js: {}
    js/bootstrap/dom/selector-engine.js: {}
    js/bootstrap/util/config.js: {}
    js/bootstrap/util/component-functions.js: {}
    js/bootstrap/util/backdrop.js: {}
    js/bootstrap/util/focustrap.js: {}
    js/bootstrap/util/scrollbar.js: {}
    js/bootstrap/util/swipe.js: {}
    js/bootstrap/util/sanitizer.js: {}
    js/bootstrap/util/template-factory.js: {}
    js/bootstrap/base-component.js: {}

# Bootstrap alert script.
bs-alert-script:
  dependencies:
    - actools_bs5/bs-base-component-script
  js:
    js/bootstrap/alert.js: {}

# Bootstrap button script.
bs-button-script:
  dependencies:
    - actools_bs5/bs-base-component-script
  js:
    js/bootstrap/button.js: {}

# Bootstrap carousel script.
bs-carousel-script:
  dependencies:
    - actools_bs5/bs-base-component-script
  js:
    js/bootstrap/carousel.js: {}

# Bootstrap collapse script.
bs-collapse-script:
  dependencies:
    - actools_bs5/bs-base-component-script
  js:
    js/bootstrap/collapse.js: {}

# Bootstrap dropdown script.
bs-dropdown-script:
  dependencies:
    - actools_bs5/bs-base-component-script
  js:
    js/bootstrap/dropdown.js: {}

# Bootstrap modal script.
bs-modal-script:
  dependencies:
    - actools_bs5/bs-base-component-script
  js:
    js/bootstrap/modal.js: {}

# Bootstrap offcanvas script.
bs-offcanvas-script:
  dependencies:
    - actools_bs5/bs-base-component-script
  js:
    js/bootstrap/offcanvas.js: {}

# Bootstrap popover script.
bs-popover-script:
  dependencies:
    - actools_bs5/bs-tooltip-script
  js:
    js/bootstrap/popover.js: {}

# Bootstrap scrollspy script.
bs-scrollspy-script:
  dependencies:
    - actools_bs5/bs-base-component-script
  js:
    js/bootstrap/scrollspy.js: {}

# Bootstrap tab script.
bs-tab-script:
  dependencies:
    - actools_bs5/bs-base-component-script
  js:
    js/bootstrap/tab.js: {}

# Bootstrap toast script.
bs-toast-script:
  dependencies:
    - actools_bs5/bs-base-component-script
  js:
    js/bootstrap/toast.js: {}

# Bootstrap tooltip script.
bs-tooltip-script:
  dependencies:
    - actools_bs5/bs-base-component-script
  js:
    js/bootstrap/tooltip.js: {}

# Actools BS5 global styles library.
global-styles:
  css:
    base:
      css/base/actools.base.css: {}
    layout:
      css/layout/edge2edge.layout.css: {}
      css/layout/equal-height.layout.css: {}
      css/layout/print.layout.css: { media: print }
    theme:
      fonts/figtree/css/figtree.css: {}
      fonts/dm-mono/css/dm-mono.css: {}

# Actools BS5 global scripts library.
global-scripts:
  js:
    js/scripts.js: {}
  dependencies:
    - core/drupalSettings
    - core/drupal
    - core/drupal.ajax
    - core/jquery
    - core/once

# Sticky header styles + behavior. Attached from actools_bs5.theme only when
# the "Sticky header" theme setting is enabled, so it never loads otherwise.
sticky-header:
  css:
    theme:
      css/theme/sticky-header.theme.css: {}
  js:
    js/sticky-header.js: {}
  dependencies:
    - core/drupal
    - core/once

# RTL libraries (framework-rtl / *-rtl) removed — standalone build ships LTR only.

# Actools BS5 content moderation status theme.
content_moderation:
  css:
    theme:
      css/theme/content-moderation.theme.css: {}

# Bootstrap free icons.
bootstrap-icons:
  css:
    theme:
      fonts/bootstrap-icons/font/bootstrap-icons.min.css: { minified: true }

# Ckeditor 5 styles.
ckeditor5-root:
  dependencies:
    - core/components.actools_bs5--root

# Ckeditor 5 styles.
ckeditor5-styles:
  dependencies:
    - core/components.actools_bs5--alert
    - core/components.actools_bs5--callout

